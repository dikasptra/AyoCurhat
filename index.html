<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AyoCurhat: Aplikasi AI pendamping kesehatan mental yang siap mendengarkan keluh kesahmu 24/7 dengan pendekatan logis dan suportif." />
    <title>My Google AI Studio App</title>
    <script>
      (function() {
        const saved = localStorage.getItem('ayocurhat_dark_mode');
        if (saved === 'true' || saved === null) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
